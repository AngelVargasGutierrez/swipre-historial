name: Pruebas RF-003 (Visualizar historial de acciones)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install
      - name: Ejecutar pruebas (CP-03-01, CP-03-02, CP-03-03)
        run: npm test
